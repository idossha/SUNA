# Packaging for the downloadable SUNA app.
#
# `build/resources/` is produced by scripts/packaging/stage-resources.mjs and
# lands at Contents/Resources — the main process resolves examples/, mcp/ and
# python/ from there via process.resourcesPath when packaged.
appId: dev.suna.app
productName: SUNA
copyright: Copyright © 2026 SUNA
directories:
  buildResources: build
  output: ../../release

files:
  - out/**
  - package.json
  # Workspace packages are bundled into out/ by electron-vite; shipping their
  # raw TypeScript sources again would only bloat the app.
  - '!node_modules/@suna/**'
  - '!**/*.map'
  - '!**/{test,tests,__tests__,example,examples,docs}/**'

extraResources:
  - from: build/resources
    to: .

# node-pty is a native module: it must stay outside the asar to be loadable.
asarUnpack:
  - '**/node-pty/**'

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.icns
  darkModeSupport: true
  # No Apple Developer identity is configured. `identity: null` skips signing
  # entirely, which leaves the bundle carrying only Electron's inherited
  # linker signature — arm64 macs then refuse it outright as "damaged".
  # Ad-hoc signing the whole bundle produces an app that launches after the
  # user clears quarantine. See docs/packaging.md.
  identity: '-'
  gatekeeperAssess: false
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: SUNA does not use the microphone.
    NSCameraUsageDescription: SUNA does not use the camera.

dmg:
  artifactName: SUNA-${version}-mac-${arch}.dmg

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.ico
  artifactName: SUNA-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  # The package name is @suna/desktop; AppImage rejects the scoped name as an
  # executable, and desktop environments need an explicit .desktop id to
  # associate running windows with the launcher.
  executableName: suna
  syncDesktopName: true
  synopsis: Academic writing platform for manuscripts, figures and references
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
  category: Office
  icon: build/icon.png
  artifactName: SUNA-${version}-linux-${arch}.${ext}

publish:
  provider: github
  owner: idossha
  repo: SUNA
