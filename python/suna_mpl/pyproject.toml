[project]
name = "suna-mpl"
version = "0.1.0"
description = "Matplotlib companion for SUNA: stable SVG element ids, journal size presets, canvas-editable SVG export"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suna_mpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
