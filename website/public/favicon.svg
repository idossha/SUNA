<!--
  SUNA's mark at favicon scale — the same lit limb as the app icon
  (resources/branding/icon.svg), redrawn on a 32 grid rather than resampled
  down from 1024.

  The limb is deliberately shallower here than in the app icon. A browser
  paints this at 16 or 32 CSS pixels and almost never larger, and the master's
  weight range (36 to 88 of 1024) would put the thin side at half a pixel:
  it drops out, and the ring reads as broken rather than as lit. These weights
  run 1.63 to 2.57 of 32 — a visible thickening that still holds a full pixel
  at its thinnest. Flat colour for the same reason: a gradient across a 16px
  tab icon is noise.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SUNA">
  <rect width="32" height="32" rx="7" fill="#16161c"/>
  <!-- outer circle r8.6 at (16,16), inner r6.5 at (15.85,15.55) -->
  <path fill-rule="evenodd" fill="#e8b45c"
        d="M7.4,16 a8.6,8.6 0 1,0 17.2,0 a8.6,8.6 0 1,0 -17.2,0 Z
           M9.35,15.55 a6.5,6.5 0 1,0 13,0 a6.5,6.5 0 1,0 -13,0 Z"/>
  <circle cx="16" cy="16" r="1.4" fill="#e8b45c"/>
</svg>
