<!--
  The bare SUNA mark: the lit limb with no ground under it, for placing on a
  surface that already has one (documentation, a title bar, a splash). Same
  construction as icon.svg, scaled to a 512 box and centred with no inset.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SUNA">
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="80" y1="52" x2="432" y2="460">
      <stop offset="0" stop-color="#f7d693"/>
      <stop offset="1" stop-color="#d4953b"/>
    </linearGradient>
  </defs>
  <path fill-rule="evenodd" fill="url(#gold)"
        d="M16,256 a240,240 0 1,0 480,0 a240,240 0 1,0 -480,0 Z
           M62,235 a180,180 0 1,0 360,0 a180,180 0 1,0 -360,0 Z"/>
  <circle cx="256" cy="256" r="36" fill="url(#gold)"/>
</svg>
