name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm stage:resources
      - run: pnpm --filter @suna/desktop exec electron-builder --config electron-builder.config.cjs ${{ matrix.args }} --publish never
        env:
          # Same secret names as TI-Toolbox, so one Developer ID serves both
          # repositories. Absent, the mac build ad-hoc signs and skips
          # notarization (see apps/desktop/electron-builder.config.cjs).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: 3BMY24SA43

      # Prove the claim rather than assume it: an unsigned or un-stapled build
      # should be visible here, not in a user's "damaged" dialog.
      - name: Verify signature and notarization
        if: matrix.os == 'macos-latest'
        run: |
          APP=$(find release -maxdepth 2 -name "*.app" -type d | head -1)
          [ -n "$APP" ] || { echo "no .app found"; exit 1; }
          echo "=== codesign ==="
          codesign -dv --verbose=4 "$APP" 2>&1 || true
          codesign --verify --deep --strict "$APP" && echo "signature verifies"
          echo "=== gatekeeper ==="
          spctl -a -vvv -t install "$APP" 2>&1 || true
          echo "=== staple ==="
          xcrun stapler validate "$APP" 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: suna-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  # Attach whatever built to the tag's release, so one platform failing does
  # not withhold the installers that did build.
  upload:
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "SUNA $TAG" --generate-notes
          # One file at a time with retries: a single flaky 400 from the
          # uploads endpoint must not cost the whole release.
          for f in artifacts/*; do
            for attempt in 1 2 3; do
              gh release upload "$TAG" "$f" --clobber && break
              echo "retrying $(basename "$f") (attempt $attempt)"
              sleep 15
            done
          done
          gh release view "$TAG" --json assets -q '.assets[].name'
