      - generic [ref=f23e83]:
        - generic [ref=f23e85]:
          - navigation "breadcrumbs" [ref=f23e87]:
            - list [ref=f23e88]:
              - listitem [ref=f23e89]:
                - link "Home" [ref=f23e90] [cursor=pointer]:
                  - /url: https://www.science.org/
                - generic [ref=f23e91]: 
