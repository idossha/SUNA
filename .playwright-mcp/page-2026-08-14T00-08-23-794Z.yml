              - listitem [ref=f39e74]:
                - generic [ref=f39e75]: Instructions for preparing a revised manuscript
            - text: 
          - heading "Instructions for preparing a revised manuscript" [level=1] [ref=f39e77]
        - generic [ref=f39e79]:
          - generic [ref=f39e81]:
            - text: 
            - generic [ref=f39e82]:
              - paragraph
              - paragraph [ref=f39e83]:
                - text: In general, the style guidelines and formatting are the same as for an initial submission. See our
                - link "instructions for preparing an initial manuscript" [ref=f39e84] [cursor=pointer]:
                  - /url: /content/page/instructions-preparing-initial-manuscript
                - text: ", which provide guidelines for each section of the manuscript. We prefer to receive final manuscripts in Word (.docx) format and encourage you to use our Word templates for the main text ("
                - link "download main text template here" [ref=f39e85] [cursor=pointer]:
                  - /url: /cms/asset/9f76328e-b5ac-4591-90ad-70065e5104ac/science_manuscript_word_template_december2025.docx
                - text: ) and supplementary materials (
                - link "download SM template here" [ref=f39e86] [cursor=pointer]:
                  - /url: /cms/asset/8676899b-1de1-431a-9e4b-c95742de6fa9/science_supplementary_materials_word_template_december2025.docx
                - text: ). If you need to submit your final manuscript file in LaTeX, please
                - link "see our LaTeX instructions" [ref=f39e87] [cursor=pointer]:
                  - /url: /content/page/preparing-manuscripts-using-latex
                - text: . Below we provide some formatting guidelines relevant to revised manuscripts. Return your revised manuscript documents by uploading them through your account at our Content Tracking System (
                - link "https://cts.sciencemag.org" [ref=f39e88] [cursor=pointer]:
                  - /url: https://cts.sciencemag.org
                - text: ).
              - paragraph [ref=f39e89]: "At the revision stage:"
              - list [ref=f39e90]:
                - listitem [ref=f39e91]: Please refer to your revision letter, checklist, and edited manuscript and follow all editorial requirements.
                - listitem [ref=f39e92]: Collate all text, references, figure legends, and tables into one .docx file. We have no naming requirements – the file will be renamed when uploaded to our manuscript handling system.
                - listitem [ref=f39e93]: Do not include the figures themselves. Figures should be uploaded as separate files. See further instructions below.
                - listitem [ref=f39e94]: Supplementary text, figures, and tables should be prepared as a separate PDF file.
                - listitem [ref=f39e95]: Use single spacing throughout the text, tables, figure legends, and references and notes.
                - listitem [ref=f39e96]: For best results, use Times New Roman font. Avoid Symbol fonts.
                - listitem [ref=f39e97]: If your manuscript contains equations, please refer to the “Preparing equations” section below.
                - listitem [ref=f39e98]: Format files for US letter paper (8.5 by 11 inches).
                - listitem [ref=f39e99]: Define technical terms, symbols, abbreviations, and acronyms the first time that they are used.
                - listitem [ref=f39e100]: Cite all tables and figures in numerical order.
                - listitem [ref=f39e101]: Remove all references to data not shown. All data must be provided in the main manuscript or the supplementary materials – or must be available in an established database, with accession details provided in the Acknowledgments.
              - paragraph [ref=f39e102]:
                - link "Back to top" [ref=f39e103] [cursor=pointer]:
                  - /url: "#ContentTop"
              - heading "Preparing revised figures" [level=2] [ref=f39e104]
              - paragraph [ref=f39e105]:
                - text: To expedite publication of your paper, please follow the style guidelines given in
                - link "instructions for preparing an initial manuscript" [ref=f39e106] [cursor=pointer]:
                  - /url: /authors/instructions-preparing-initial-manuscript
                - text: . It is best to create your figures as vector-based files, such as those produced by Adobe Illustrator. Vector-based files will give us maximum flexibility for sizing your figures properly without losing resolution, as they can be altered in size while maintaining high-quality resolution. For helpful tips, please refer to our
                - link "figure preparation guide" [ref=f39e107] [cursor=pointer]:
                  - /url: /cms/asset/62583409-a188-466e-8cc0-6fb5f083bbff/author_prep_guide_2025.pdf
                - text: .
              - paragraph [ref=f39e108]: Submit each figure as an individual file separated from the manuscript text.
              - heading "Figure layout and scaling" [level=3] [ref=f39e109]
              - paragraph [ref=f39e110]: The width of figures, when printed, will usually be 5.7 cm (2.24 inches or 1 column) or 12.1 cm (4.76 inches or 2 columns), or 18.4 cm (7.24 inches or 3 columns). Bar graphs, simple line graphs, and gels may be reduced to a smaller width. Symbols and lettering should be large enough to be legible after reduction [a reduced size of about 7 points (2.5 mm) high, and not smaller than 5 points]. Avoid wide variation in type size within a single figure. When laying out information in a figure, the objective is to maximize the space given to presentation of the data. Avoid wasted white space and clutter.
              - heading "Resolution" [level=3] [ref=f39e111]
              - paragraph [ref=f39e112]:
                - text: It is
                - emphasis [ref=f39e113]: essential
                - text: that revised manuscripts have adequate figure resolution for high-quality print and online rendering. Line art that is not available as a vector file should have a resolution of at least 300 dots per inch (dpi), preferably higher, at final size (see “Figure layout and scaling” above). Grayscale and color images should have a minimum resolution of 300 dpi at final size, and a higher resolution if possible.
              - paragraph [ref=f39e114]: Please note that these resolutions apply to figures sized at dimensions comparable to those of figures in the PDF or print version of the final published article. Reducing or enlarging the dimensions of a digital image will also change its effective resolution. For example, reducing the dimensions of an image by 50%, with no change in file size, will double its effective resolution. Doubling the dimensions of the image will cut resolution by 50%, increase visible pixilation, and degrade image quality. Upsampling of images (i.e., artificially increasing file size or resolution) is not permitted.
              - heading "Format" [level=3] [ref=f39e115]
              - paragraph [ref=f39e116]: "Figure files at the revision stage must be in one of the following formats (in preferred order):"
              - paragraph [ref=f39e117]:
                - emphasis [ref=f39e118]: Vector illustrations and diagrams (preferred)
                - text: ": Adobe Portable Document Format (PDF) Encapsulated PostScript (EPS), or Adobe Illustrator (AI)"
              - paragraph [ref=f39e119]:
                - emphasis [ref=f39e120]: Raster illustrations and diagrams
                - text: ": Tagged Image File Format (TIFF), minimum 300 dpi"
              - paragraph [ref=f39e121]:
                - emphasis [ref=f39e122]: Vector and raster combinations for photographs or microscopy images
                - text: ": Adobe Portable Document Format (PDF) or Encapsulated PostScript (EPS)"
              - paragraph [ref=f39e123]:
                - emphasis [ref=f39e124]: Raster photographs or microscopy images
                - text: ": Tagged Image File Format (TIFF)"
              - paragraph [ref=f39e125]:
                - text: Please keep an archive of all original images used in figures, as
                - emphasis [ref=f39e126]: Science
                - text: may request delivery of these images for production purposes. Save these at the highest resolution possible, preferably as the original file in its native format.
              - paragraph [ref=f39e127]:
                - text: At this stage in the process, we cannot accept files in formats other than those specified above; in particular, we
                - strong [ref=f39e128]: cannot
                - text: "accept:"
              - list [ref=f39e129]:
                - listitem [ref=f39e130]: Figures embedded in Microsoft Word files
                - listitem [ref=f39e131]: Microsoft PowerPoint files
              - paragraph [ref=f39e132]:
                - link "Back to top" [ref=f39e133] [cursor=pointer]:
                  - /url: "#ContentTop"
              - heading "Preparing equations" [level=2] [ref=f39e134]
              - list [ref=f39e135]:
                - listitem [ref=f39e136]: Long equations should be set on their own line and numbered sequentially. After an equation is introduced, refer to it by number (e.g., “Eq. 1,” “Eqs. 3 and 4”).
                - listitem [ref=f39e137]: Use standard text and fonts for simple equations (i.e., those set on a single baseline).
                - listitem [ref=f39e138]: For complex equations, use MathType (recommended) or the legacy equation editor in Word (chose Insert > Insert Object > Word Equation). Do not use the native Word 2007, 2008, 2010, or 2011 equation editor, because this may result in display errors.
                - listitem [ref=f39e139]: The same guidelines apply to mathematical expressions within a sentence of text (e.g., inline equations).
              - paragraph [ref=f39e140]:
                - link "Back to top" [ref=f39e141] [cursor=pointer]:
                  - /url: "#ContentTop"
