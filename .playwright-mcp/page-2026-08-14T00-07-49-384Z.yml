                    - emphasis [ref=e99]: Science
                    - text: Citation Style
                - paragraph [ref=e100]:
                  - text: Information on manuscript types, including length constraints, can be found on our
                  - link "general information for authors" [ref=e101] [cursor=pointer]:
                    - /url: /content/page/science-information-authors
                  - text: page. The instructions below apply to an initial submission. For a manuscript submitted after peer review and revision, the same style guidelines apply, but we require slightly different file preparation – see
                  - link "instructions specific to a revised manuscript" [ref=e102] [cursor=pointer]:
                    - /url: /content/page/instructions-preparing-revised-manuscript
                  - text: .
                - paragraph
                - heading "Format and style of main manuscript" [level=2] [ref=e103]
                - paragraph [ref=e104]:
                  - text: For the main manuscript,
                  - emphasis [ref=e105]: Science
                  - text: prefers to receive a single, complete file that includes all figures and tables in Word’s .docx format (all versions after Word 2007 for PC and Word 2011 for Mac) –
                  - link "download a copy of our Word template here" [ref=e106] [cursor=pointer]:
                    - /url: /cms/asset/8e15c5d2-405e-440f-ab38-9f118cc2b6f8/science_manuscript_word_template_december2025.docx
                  - text: . The supplementary materials should be submitted as a single separate file in .docx or PDF format. To aid in the organization of supplementary materials, we recommend using or following the
                  - link "Microsoft Word template supplied here" [ref=e107] [cursor=pointer]:
                    - /url: /cms/asset/03e3a1a7-ce19-49cc-9f16-92368b556461/science_supplementary_materials_word_template_december2025.docx
                  - text: .
                - paragraph [ref=e108]:
                  - text: If you are using LaTeX, please convert your paper into .docx format. If this is not possible, please use our LaTeX template (available
                  - link "here" [ref=e109] [cursor=pointer]:
                    - /url: /content/page/preparing-manuscripts-using-latex
                  - text: ) and upload a PDF version of your paper.
                - paragraph [ref=e110]: Use single spacing throughout the text, tables, figure captions, and reference list. Electronic files should be formatted for US letter paper (8.5 by 11 inches). Technical terms should be defined. Symbols, abbreviations, and acronyms should be defined the first time they are used. All tables, figures, and references should be cited in numerical order. For best results, use Times New Roman font. Avoid Symbol fonts if possible.
                - paragraph [ref=e111]:
                  - text: Manuscripts should be assembled in the order listed below (for easy and accurate assembly,
                  - link "download a copy of our Word template here" [ref=e112] [cursor=pointer]:
                    - /url: /cms/asset/8e15c5d2-405e-440f-ab38-9f118cc2b6f8/science_manuscript_word_template_december2025.docx
                  - text: ). Our manuscript submission system will attempt to extract metadata from your paper to facilitate the submission process. To improve machine readability, please identify the parts of your paper, even if you do not use our template. Please begin each section with the specific key words listed below, some of which are followed by a colon. Several of these headings are optional—for example, not all papers will include tables or supplementary materials. Please do not use paragraph breaks in the title, author list, or abstract.
                - paragraph [ref=e113]:
                  - strong [ref=e114]: "Title:Authors:Affiliations:Abstract:Main Text:References and NotesAcknowledgments:List of Supplementary Materials:"
                  - strong [ref=e115]: "Fig. #:"
                  - text: (Begin each figure caption with a label—e.g., “Fig. 1”— as a new paragraph)
                  - strong [ref=e116]: "Table #:"
                  - text: (Begin each table caption with a label—e.g., “Table 1”—as a new paragraph)
                - paragraph [ref=e117]:
                  - strong [ref=e118]: Titles
                  - text: should be no more than 96 characters (including spaces).
                - paragraph [ref=e119]:
                  - strong [ref=e120]: Authors
                  - text: "and their affiliated institutions, linked by superscript numbers, should be listed beneath the title on the opening page of the manuscript. Note that affiliations should indicate the institution(s) where the work was performed. If an author has since changed institutions, this may be specified with a present address footnote. Symbols are used for equal contribution, present address, and corresponding author footnotes. Always use * to indicate the corresponding author(s). Other symbols should be as follows, in order of appearance in the author list (note that the symbols are not superscripted): †, ‡, §, ¶, #, **, ††, ‡‡, etc. These symbols should appear after the numbered affiliations in the author list (e.g., T. Crow"
                  - superscript [ref=e121]: 1,2
                  - text: "*, J. Russo"
                  - superscript [ref=e122]: "3"
                  - text: †).
                  - emphasis [ref=e123]: Science
                  - text: does not permit the designation of co-senior authors or co-first authors or the like; standard language (“These authors contributed equally to this work”) is used instead.
                - paragraph [ref=e124]:
                  - strong [ref=e125]: Abstracts
                  - text: "of Research Articles should explain to the general reader why the research was done, what was found and why the results are important. They should start with some brief BACKGROUND information: a sentence giving a broad introduction to the field comprehensible to the general reader, and then a sentence of more detailed background specific to your study. This should be followed by an explanation of the OBJECTIVES/METHODS and then the RESULTS. The final sentence should outline the main CONCLUSIONS of the study, in terms that will be comprehensible to all readers. The Abstract is distinct from the main body of the text and thus should not be the only source of background information critical to understanding the manuscript. Please do not include citations or abbreviations in the Abstract. The abstract should be 125 words or less."
                - paragraph [ref=e126]:
                  - strong [ref=e127]: Main Text
                  - text: is divided into subheadings for Research Articles and Reviews. Subheadings should be descriptive clauses, not full sentences. Up to three levels of subheadings may be used if warranted; please distinguish them clearly (bold for level one, bold and italic for level two, and italic for level three; each heading should be set off by a line break). The manuscript should start with a brief introduction describing the paper’s significance. The introduction should provide sufficient background information to make the article intelligible to readers in other disciplines and sufficient context so that the significance of the experimental findings is clear. Technical terms should be defined. Symbols, abbreviations, and acronyms should be defined the first time they are used. All tables and figures should be cited in numerical order. All data must be shown in either the main text or the supplementary materials or must be available in a permanent, publicly accessible repository. Associated DOIs and repository-specific accession codes should be disclosed in the Acknowledgments. References to unpublished materials are not allowed to substantiate significant conclusions of the paper
                - paragraph [ref=e128]:
                  - strong [ref=e129]: References and Notes
                  - text: "are numbered in the order in which they are cited: through (i) the main text, (ii) text boxes (if any), (iii) figure and table captions, (iv) reference notes and acknowledgments, and finally (v) supplementary materials. Place citation numbers within parentheses, italicized: ("
                  - emphasis [ref=e130]: "18"
                  - text: ","
                  - emphasis [ref=e131]: "19"
                  - text: ) (
                  - emphasis [ref=e132]: "18"
                  - text: –
                  - emphasis [ref=e133]: "20"
                  - text: ) (
                  - emphasis [ref=e134]: 18, 20–22
                  - text: ). There should be a single reference list that combines references cited in the main paper as well as those cited in the supplementary materials, and each reference should appear only once in the list. The full reference list will be included online in the HTML version of the main paper and in the supplementary materials PDF, but references cited only in the supplementary materials will be suppressed in print and in the main-paper PDF. Each reference should have a unique number; do not combine references or embed references in notes. Any references to in-press manuscripts at the time of submission should be given a number in the text and placed, in correct sequence, in the references and notes list. We do not allow citation of personal communications, and unpublished or “in press” references are not allowed at the time of publication. We do allow citations to papers posted at preprint servers (e.g., arXiv, bioRxiv). Any dataset that has a DOI must be cited in the reference list. If a dataset (with a DOI) is cited in the Acknowledgments, its reference number should be the last one before the supplementary references, unless the dataset has been cited earlier in the paper. Do not use
                  - emphasis [ref=e135]: op. cit.
                  - text: ","
                  - emphasis [ref=e136]: ibid.
                  - text: ", or"
                  - emphasis [ref=e137]: et al.
                  - text: (in place of the complete list of authors’ names). Notes should be used for information aimed at the specialist (e.g., procedures) or to provide definitions or further information for the general reader that are not essential to the data or arguments. Notes can cite other references (by number). Journal article references should be complete, including the full list of authors, full titles, and inclusive pagination. Article titles are displayed in the HTML versions, but not in the print or the PDF versions of papers. See
                  - link [ref=e138] [cursor=pointer]:
                    - /url: /content/page/instructions-preparing-initial-manuscript#science-citation-style
                    - emphasis [ref=e139]: Science
                    - text: Citation Style
                  - text: below for details of citation style.
                - paragraph [ref=e140]:
                  - strong [ref=e141]: Acknowledgments
                  - text: should appear after the final numbered reference. This section should start by acknowledging non-author contributions and then should provide information under the following headings.
                  - strong [ref=e142]: "Funding:"
                  - text: This section should include complete funding information for all authors.
                  - strong [ref=e143]: "Authors contributions:"
                  - text: Authors should be identified by their initials in an itemized list of their contributions to the paper (e.g., J.S. performed experiments, Y.-S.Z. performed theoretical modeling, etc.). We encourage you to follow the
                  - link "CRediT" [ref=e144] [cursor=pointer]:
                    - /url: https://credit.niso.org/
                  - text: taxonomy.
                  - generic [ref=e145]:
                    - strong [ref=e146]: "Diversity, equity, ethics, and inclusion [optional]:"
                    - text: We welcome statements pertaining to diversity, equity, ethics, and inclusion, as outlined in our
                    - link "Editorial Policies" [ref=e147] [cursor=pointer]:
                      - /url: /content/page/science-journals-editorial-policies#dei
                    - text: .
                  - strong [ref=e148]: "Competing interests:"
                  - text: Competing interests of any of the authors must be listed here (all authors must also fill out the
                  - link "Conflict of Interest form" [ref=e149] [cursor=pointer]:
                    - /url: /admin/dopub/10.5555/science-journals-editorial-policies/files/authorship_form_2024.pdf
                  - text: ). Patent applications should be disclosed here as well, specifying inventor(s), institution(s), and reference number(s). When authors have no competing interests, this should also be declared.
                  - strong [ref=e150]: "Data, code, and materials availability:"
                  - text: Any restrictions on materials, such as material transfer agreements (MTAs), should be disclosed here. Accession numbers to data deposited in a public database can be listed here, though it is preferable for data and code to be archived in a permanent repository that provides a citable DOI, which should then be included in the main reference list (numbered as the last item before the supplementary references) and cited here. If all data are in the paper and supplementary materials, include the sentence “All data are available in the manuscript or the supplementary materials.” All data, code, and materials used in the analysis must be available to any researcher for purposes of reproducing or extending the analysis. All papers should contain a materials availability statement, even if there are no newly created materials or if all instructions for synthesizing the materials are provided in the supplementary materials. For more information, please refer to the
                  - link "“Data and Code Deposition” section of our Editorial Policies" [ref=e151] [cursor=pointer]:
                    - /url: /content/page/science-journals-editorial-policies#data-and-code-deposition
                  - text: .
                - paragraph [ref=e152]:
                  - strong [ref=e153]: List of Supplementary Materials.
                  - text: After the Acknowledgments, list your supplementary items as shown in the example below.
                - paragraph [ref=e154]:
                  - strong [ref=e155]: Supplementary Materials
                  - text: Materials and MethodsSupplementary TextFigs. S1 to S4Tables S1 and S2References (
                  - emphasis [ref=e156]: "26"
                  - text: –
                  - emphasis [ref=e157]: "32"
                  - text: )Data S1Movie S1
                - paragraph [ref=e158]:
                  - strong [ref=e159]: Tables
                  - text: "should be included after the references and should supplement, not duplicate, the text. They should be called out within the text and numbered in the order of their citation in the text. The first sentence of the table caption should be a brief descriptive title. The title should be applicable to the table as a whole; it should not include citations of references, figures, or other tables. Every vertical column should have a heading, consisting of a title with the unit of measure in parentheses. Units should not change within a column. Footnotes should contain information relevant to specific entries or parts of the table, labeled with symbols in the following order: *, †, ‡, §, ¶, #, **, etc. Reference citations in a table should follow"
                  - emphasis [ref=e160]: Science
                  - text: ’s standard format (italic number in parentheses) and refer to entries in the main reference list; full references should not be embedded in or below the table.
                - paragraph [ref=e161]:
                  - strong [ref=e162]: Figure captions
                  - text: should be single-spaced in numerical order. A short figure title should be included in bold-face type as the first line of the caption. The title should be applicable to the figure as a whole; it should not include citations of individual figure panels, references, tables, or other figures. No single caption should be longer than 200 words. Nomenclature, abbreviations, symbols, and units used in a figure should match those used in the text. Distinct figure panels should be labeled with uppercase letters (A, B, etc.) and should each be described in order within the caption.
                - paragraph [ref=e163]:
                  - strong [ref=e164]: Figures
                  - text: should be called out within the text and numbered in the order of their citation in the text. For initial submission, figures should be embedded directly in the .docx or PDF manuscript file. See
                  - link "below" [ref=e165] [cursor=pointer]:
                    - /url: /content/page/instructions-preparing-initial-manuscript#preparation-of-figures
                  - text: for detailed instructions on preparation of and preferred formats for your figures.
                - paragraph [ref=e166]:
                  - link "Back to Top" [ref=e167] [cursor=pointer]:
                    - /url: "#ContentTop"
                - heading "Format and style of supplementary materials" [level=2] [ref=e168]
                - paragraph [ref=e169]:
                  - strong [ref=e170]: Supplementary materials
                  - text: (SM) are posted permanently at the
                  - emphasis [ref=e171]: Science
                  - text: website, are linked to the manuscript, and are freely available. Supplementary materials must be essential to the scientific integrity and excellence of the paper. The supplementary materials are subject to the same editorial standards and peer-review procedures as the main paper. To aid in the organization of supplementary materials, we recommend using or following the
                  - link "Microsoft Word template supplied here" [ref=e172] [cursor=pointer]:
                    - /url: /cms/asset/03e3a1a7-ce19-49cc-9f16-92368b556461/science_supplementary_materials_word_template_december2025.docx
                  - text: .
                - paragraph [ref=e173]: "In general, the supplementary materials may comprise:"
                - list [ref=e174]:
                  - listitem [ref=e175]:
                    - strong [ref=e176]: "Materials and Methods:"
                    - text: The materials and methods section should provide sufficient information to allow replication of the study. It may be cited at relevant points in the text as “see materials and methods” or using a citation number that refers to a note in the reference list that reads “Materials and methods are available as supplementary materials.” Study design should be described in detail and descriptions of reagents and equipment should facilitate replication (for example, source and purity of reagents should be specified, there should be evidence that antibodies have been validated, and cell lines should be authenticated). Clinical and preclinical studies should include a section titled Experimental Design at the
                    - emphasis [ref=e177]: beginning
                    - text: of the materials and methods in which the objectives and design of the study, as well as prespecified components, are described. Statistical methods must be described with enough detail to enable a knowledgeable reader with access to the original data to verify the results. The values for
                    - emphasis [ref=e178]: "N"
                    - text: ","
                    - emphasis [ref=e179]: P
                    - text: ", and the specific statistical test(s) performed for each experiment should be included in the appropriate figure caption or main text. Please see our editorial policies for additional guidelines for specific types of studies, as well as further details on reporting of statistical analysis."
                  - listitem [ref=e180]:
                    - strong [ref=e181]: "Supplementary Text:"
                    - text: This section should provide additional information regarding control or supplemental experiments, field sites, observations, hypotheses, etc., that bear directly on the arguments of the main paper. Further discussion or development of arguments beyond those in the main text is not permitted in supplementary text. This section can be referred to in the main text as “supplementary text” (reference note not required).
                  - listitem [ref=e182]:
                    - strong [ref=e183]: "Figures:"
                    - text: Supplementary figures are those that cannot be accommodated in the main paper but are integral to the paper’s arguments. Supplementary figures should meet the same standards as main-paper figures. These are numbered starting at 1, with the prefix “S”—e.g., fig. S1 (note the lowercase “f”). All figures should be called out in the main text. Reference notes are not required. See
                    - link "below" [ref=e184] [cursor=pointer]:
                      - /url: /content/page/instructions-preparing-initial-manuscript#preparation-of-figures
                    - text: for detailed instructions.
                  - listitem [ref=e185]:
                    - strong [ref=e186]: "Tables:"
                    - text: Supplementary tables are extensive data tables that are useful in assessing the arguments of the main paper. These are numbered starting at 1, with the prefix “S”—e.g., table S1 (note the lowercase “t”). These data should be in a standard machine-readable format (e.g., csv, tsv, json, or xml) and should be accompanied by a brief explanation of their structure and meaning.
                  - listitem [ref=e187]:
                    - strong [ref=e188]: "Data files:"
                    - text: Tabulated data underlying the figures should be uploaded as an additional supplementary data file (called “data S1”) in a standard machine-readable format (e.g., csv, tsv, json, or xml). Organize this as a multi-sheet Excel document, indicating to which figure panel each of the datasets corresponds. Include
                    - emphasis [ref=e189]: P
                    - text: values here as well.
                  - listitem [ref=e190]:
                    - strong [ref=e191]: "Multimedia files:"
                    - text: Video clips should be saved in MPEG-4 (.mp4) (preferred) or QuickTime (.mov) container format using H.264 video encoding. Animated GIFs are
                    - emphasis [ref=e192]: not
                    - text: Authors should opt for the minimum frame size and number of images that are consistent with a reasonably effective on-screen presentation. Aim to stay within 640 × 480 or 1280 × 720 resolution. Do not exceed full HD frame size (1920 × 1080), as this makes the files quite large and will cause them to be transcoded/sized to an acceptable resolution. For audio files, please use .wav, .mp3, or .m4a format, with a bit rate of 160 kb/s. Video, audio, or other multimedia files should be submitted with accompanying captions (and credit information when applicable).
                  - listitem [ref=e193]:
                    - strong [ref=e194]: References only cited in the
                    - text: supplementary materials should be included at the end of the reference section of the main text, and the reference numbering should continue as if the supplementary materials are a continuation of the main text, with no duplicate entries.
                - paragraph [ref=e195]:
                  - text: At both initial submission and the revision stage, authors should submit the supplementary sections, materials and methods, text, tables and figures, as a single docx or PDF file that does not exceed 50 MB. The text and tables should be single spaced, figures should be individually numbered, and each figure caption should be placed immediately beneath the corresponding figure, on the same page if possible. Supplementary multimedia or large data files that cannot be included in the main supplementary materials file should be uploaded as auxiliary supplementary materials (up to 10 files, total size limited to 25 MB) or movies (limited to 50 MB each). If you have files essential to the evaluation of your manuscript that exceed these limits, please contact
                  - link "submit_help@aaas.org" [ref=e196] [cursor=pointer]:
                    - /url: mailto:submit_help@aaas.org
                  - text: . See
                  - link "Submitting your manuscript" [ref=e197] [cursor=pointer]:
                    - /url: /content/page/science-information-authors#submitting-manuscripts
                  - text: for further details on how to submit
                - paragraph [ref=e198]:
                  - link "Back to Top" [ref=e199] [cursor=pointer]:
                    - /url: "#ContentTop"
                - paragraph
                - heading "Preparation of figures" [level=2] [ref=e200]
                - paragraph [ref=e201]:
                  - strong [ref=e202]: "Creating your figures:"
                  - text: It is best to create your figures as vector-based files, such as those produced by Adobe Illustrator. Vector-based files will give us maximum flexibility for sizing your figures properly without losing resolution, as they can be altered in size while maintaining high-quality resolution.
                  - emphasis [ref=e203]:
                    - text: We
                    - strong [ref=e204]: cannot
                    - text: accept PowerPoint files or files that are not readable by Adobe Photoshop or Adobe Illustrator
                  - text: . When using Photoshop, please keep all labeling on a separate, editable layer if possible. To keep file sizes reasonable, please save images at a resolution of 300 dots per inch (dpi) for initial submission. A higher resolution applies for figures submitted at the revision stage – see
                  - link "instructions for preparing a revised manuscript" [ref=e205] [cursor=pointer]:
                    - /url: /authors/instructions-preparing-revised-manuscript
                  - text: . For helpful tips, please refer to our
                  - link "figure preparation guide" [ref=e206] [cursor=pointer]:
                    - /url: /cms/asset/67f37ac8-4d02-4625-8a05-230568cb8323/author_prep_guide_2025.pdf
                  - text: .
                - paragraph [ref=e207]:
                  - strong [ref=e208]: "Paper:"
                  - text: The width of figures, when printed, will usually be 5.7 cm (2.24 inches or 1 column), 12.1 cm (4.76 inches or 2 columns), or 18.4 cm (7.24 inches or 3 columns). Bar graphs, simple line graphs, and gels may be reduced to a smaller width. Symbols and lettering should be large enough to be legible after reduction [a reduced size of about 7 points (2.5 mm) high, and not smaller than 5 points]. Avoid wide variation in type size within a single figure. In laying out information in a figure, the objective is to maximize the space given to presentation of the data. Avoid wasted white space and clutter.
                - heading "General guidelines" [level=3] [ref=e209]
                - list [ref=e210]:
                  - listitem [ref=e211]: The figure’s title should be at the beginning of the figure caption, not in the figure itself. In general, explanatory text within the figure should be minimized relative to the text in the caption, because it is easier to fix typos and other errors in the caption.
                  - listitem [ref=e212]: Include the figure’s identifying number (e.g., “Fig. 1”) on the same manuscript page that includes the figure.
                  - listitem [ref=e213]: Keys to symbols, if needed, should be as simple as possible and positioned so that they do not needlessly enlarge the figure. Details can be put into the captions.
                  - listitem [ref=e214]: Use solid symbols for plotting data, if possible (unless data overlap or there are multiple symbols). Size symbols so that they will be distinguishable when the figure is reduced (6 point minimum). Line widths should be legible upon reduction (minimum of 0.5 point at the final reduced size).
                  - listitem [ref=e215]: Panels should be set close to each other, and common axis labels should not be repeated.
                  - listitem [ref=e216]: Scales or axes should not extend beyond the range of the data plotted.
                  - listitem [ref=e217]:
                    - text: Use scale bars in place of, or in addition to, magnifications. Do not use minor tick marks in scales or grid lines. Avoid using
                    - emphasis [ref=e218]: "y"
                    - text: "-axis labels on the right that repeat those on the left."
                - paragraph [ref=e219]:
                  - strong [ref=e220]: Color-mix and contrast considerations
                - list [ref=e221]:
                  - listitem [ref=e222]: Avoid using red and green together, as this creates problems for individuals with color-deficient vision.
                  - listitem [ref=e223]: Do not use colors that are similar in hue to identify different parts of a figure.
                  - listitem [ref=e224]: Avoid using grayscale.
                  - listitem [ref=e225]: Use white type and scale bars over darker areas of images.
                  - listitem [ref=e226]: Units should be metric and follow SI convention.
                - paragraph [ref=e227]:
                  - strong [ref=e228]: Typefaces and labels
                - paragraph [ref=e229]: "Please observe the following guidelines for labels on graphs and figures:"
                - list [ref=e230]:
                  - listitem [ref=e231]: Use a sans-serif font whenever possible (Helvetica is preferred).
                  - listitem [ref=e232]: Simple solid or open symbols reduce well.
                  - listitem [ref=e233]: Label graphs on the ordinate and abscissa with the parameter or variable being measured, the units of measure in parentheses, and the scale. Scales with large or small numbers should be presented as powers of 10.
                  - listitem [ref=e234]: Avoid the use of light lines and screen shading. Instead, use black-and-white, hatched, and cross-hatched designs for emphasis.
                  - listitem [ref=e235]: Capitalize only the first letter in a label, not every word (however, proper nouns should always be capitalized).
                  - listitem [ref=e236]: Units should be included in parentheses. Use SI notation. If there is room, write out variables – e.g., Pressure (MPa), Temperature (K). Seconds should be abbreviated as “s”, not “sec”; minutes should be abbreviated as “min.”; and hours should not be abbreviated.
                  - listitem [ref=e237]:
                    - text: Variables are always set in italics or as plain Greek letters (e.g.,
                    - emphasis [ref=e238]: P
                    - text: ","
                    - emphasis [ref=e239]: T
                    - text: ", μ). The rest of the text in the figure should be plain or bold text."
                  - listitem [ref=e240]: In a color figure, type atop a color region should be in bold face. Avoid using colored type.
                  - listitem [ref=e241]: When figures are assembled from multiple gels or micrographs, a line or space should indicate the border between two original images.
                  - listitem [ref=e242]: Use leading zeros on all decimals – e.g., 0.3, 0.55 – and report only significant digits.
                  - listitem [ref=e243]:
                    - text: Use capital letters for part labels in multipart figures – A, B, C, etc. These should be
                    - strong [ref=e244]: 10 pt and bold
                    - text: in the final figure. When possible, place part labels in the upper left corner of each figure part; if a part is an image, set labels inside the perimeter so as not to waste space.
                  - listitem [ref=e245]: Avoid subpart labels within a figure part. Instead, maintain the established sequence of part labels [e.g., use A, B, C, D, E instead of A, B, C(a), C(b), C(c)]. If use of subpart labels is unavoidable, use lowercase letters (a, b, c), prime symbols, or lowercase Roman numerals (i, ii, iii). Use numbers (1, 2, 3) only to represent a time sequence of images.
                  - listitem [ref=e246]: When reproducing images that include labels with illegible computer-generated type (e.g., units for scale bars), omit such labels and present the information in the caption instead.
                  - listitem [ref=e247]:
                    - strong [ref=e248]: Sequences
                    - text: may be reduced considerably, so the typeface in the original should be clear. There should be about 130 characters and spaces per line for a sequence occupying the full width of the printed page and about 84 characters and spaces per line for a sequence occupying two columns.
                - paragraph [ref=e249]:
                  - strong [ref=e250]: "Modification of figures:"
                  - emphasis [ref=e251]: Science
                  - text: does not allow certain electronic enhancements or manipulations of micrographs, gels, or other digital images. Figures assembled from multiple photographs or images, or non-concurrent portions of the same image, must clearly indicate the separate parts with lines between them. Linear adjustment of contrast, brightness, or color must be applied to an entire image or plate equally. Nonlinear adjustments must be specified in the figure caption. Selective enhancement or alteration of one part of an image is not acceptable. In addition,
                  - emphasis [ref=e252]: Science
                  - text: may ask authors of papers returned for revision to provide additional documentation of their primary data.
                - paragraph [ref=e253]:
                  - strong [ref=e254]: "Permissions:"
                  - text: Images that have been obtained, reproduced, and/or adapted from elsewhere must be accompanied by proof of permission from the copyright holder, and the credit line must be provided in the manuscript. If you are unable to obtain permission, the image cannot be used. If previously published data are used to create an entirely new graphic, the source of the data must be credited in the manuscript. Guidelines for obtaining permissions to use third-party images can be found
                  - link "here" [ref=e255] [cursor=pointer]:
                    - /url: /cms/asset/f08cd396-b391-4bf8-b3f0-770246146db0/guidelines_for_obtaining_permissions_to_use_third_party_images_v.11122025.2.pdf
                  - text: .
                - paragraph [ref=e256]:
                  - link "Back to Top" [ref=e257] [cursor=pointer]:
                    - /url: "#ContentTop"
                - paragraph
                - heading [level=2] [ref=e258]:
                  - emphasis [ref=e259]: Science
                  - text: Citation Style
                - heading "General comments" [level=3] [ref=e260]
                - paragraph [ref=e261]: "Author names: Use initials first for all authors, (separated by a space) for given names; spell out family names in full. Use commas (not “and”) to separate author names. Do not use punctuation before name suffixes (e.g., Jr., 3rd, III)."
                - heading "Journal articles" [level=4] [ref=e262]
                - paragraph [ref=e263]:
                  - text: Titles of cited articles should be included, followed by a period. Journal titles should be in italics; volume numbers should be in bold. (If there is no volume number, use the publication year in its place.) Do not place a comma before the volume number or before any parentheses. Provide the full page range, with numbers separated by an en dash. If the publication does not have continuous page numbers, use the article number (or citation number) instead of the page range. Indicate the publication year in parentheses. End each listing with a period. Do not use “
                  - emphasis [ref=e264]: ibid.
                  - text: ” or “
                  - emphasis [ref=e265]: op. cit.
                  - text: ”
                - heading "Examples" [level=5] [ref=e266]
                - paragraph [ref=e267]:
                  - text: 1. A. B. Author, C. D. Author, Example article title.
                  - emphasis [ref=e268]: Example
                  - emphasis [ref=e269]: Journal Name
                  - strong [ref=e270]: "55"
                  - text: ", 100–108 (2021).[with page range]"
                - paragraph [ref=e271]:
                  - text: 2. A. B. Author, C. D. Author, Example article title.
                  - emphasis [ref=e272]: Example
                  - emphasis [ref=e273]: Journal Name
                  - strong [ref=e274]: "346"
                  - text: ", e12345 (2022).[with article number instead of page range]"
                - paragraph [ref=e275]:
                  - text: 3. A. B. Author, C. D. Author, Example article title.
                  - emphasis [ref=e276]: Example
                  - emphasis [ref=e277]: Journal Name
                  - strong [ref=e278]: "17"
                  - text: (suppl. 1), 62–66 (2020).[with supplement number]
                - paragraph [ref=e279]:
                  - text: 4. S. Author, M. Author, H. Author, Example article title.
                  - emphasis [ref=e280]: Example
                  - emphasis [ref=e281]: Journal Name
                  - text: DOI (2022).[early online publication/epub ahead of print (use DOI instead of volume and page/article numbers)]
                - heading "Whole books" [level=4] [ref=e282]
                - paragraph [ref=e283]: For edited books, insert the editor name(s), followed by “Ed.,” or “Eds.,” before the title. Italicize the book title and use “title case” (see examples below). After the title, provide (in parentheses) the publisher name, edition number (if any), and year.
                - heading "Examples" [level=5] [ref=e284]
                - paragraph [ref=e285]:
                  - text: 1. G. Y. Author,
                  - emphasis [ref=e286]: Example Book Title
                  - text: (Publisher, 2022).[basic example]
                - paragraph [ref=e287]:
                  - text: 2. X. Editor, Y. Z. Editor, Q. Editor, Eds.,
                  - emphasis [ref=e288]: Example Book Title
                  - text: (Publisher, 2021).[with editors rather than authors]
                - paragraph [ref=e289]:
                  - text: 3. M. Author, T. Author,
                  - emphasis [ref=e290]: Example Book Title
                  - text: (Publisher, ed. 3, 2022).[with edition number]
                - paragraph [ref=e291]:
                  - text: 4. Organization Name,
                  - emphasis [ref=e292]: Example Book Title
                  - text: (Organization Name, 2021).[organization as both author and publisher]
                - heading "Book chapters" [level=4] [ref=e293]
                - paragraph [ref=e294]: Style is as above (for whole books), except that “in” appears before the title, and the names of the editors appear after the title. The chapter title may be provided before the book title; enclose chapter titles in quotes and use initial caps. After the information in parentheses, provide the complete page number range (and/or chapter number) of the cited material.
                - heading "Examples" [level=5] [ref=e295]
                - paragraph [ref=e296]:
                  - text: "1. A. Author, Z. Author, “Optional: Example chapter title” in"
                  - emphasis [ref=e297]: Example Book Title
                  - text: (Publisher, 2022), pp. 300–350.[with chapter title]
                - paragraph [ref=e298]:
                  - text: 2. T. D. Author, U. R. Author, in
                  - emphasis [ref=e299]: Example Book Title
                  - text: ", F. Editor, Ed. (Publisher, 2021), pp. 37–71.[with editor]"
                - heading "Books in series" [level=4] [ref=e300]
                - paragraph [ref=e301]: If the book is part of a series, indicate the series title after the book title. The volume number is optional.
                - heading "Examples" [level=5] [ref=e302]
                - paragraph [ref=e303]:
                  - text: 1. A. Author, B. Author,
                  - emphasis [ref=e304]: Example
                  - emphasis [ref=e305]: Book Title
                  - text: ", vol. 5 of Example Series Title (Publisher, 2022)."
                - heading "Technical reports and monographs" [level=4] [ref=e306]
                - paragraph [ref=e307]: "The title should be in quotes and should have initial caps. After the title, provide the following in parentheses: report number (if applicable), publisher name, and year. A URL may be provided as well. Monographs in series may be treated as journals."
                - heading "Examples" [level=5] [ref=e308]
                - paragraph [ref=e309]: 1. G. B. Author, “Example report title” (Tech. Rep. ABCD-12-34, Publisher, 2022).[with report number]
                - paragraph [ref=e310]: 2. F. Author, “Example report title” (Publisher, 2020); URL.[with URL]
                - paragraph [ref=e311]: 3. “Example report title” (Tech. Rep. 83902, Publisher, 2021).[no author]
                - heading "Meetings, conferences, and proceedings" [level=4] [ref=e312]
                - paragraph [ref=e313]: If published, style is same as for book references. If unpublished, include the title of meeting, location, date(s), and sponsoring organization (if not part of the meeting name). Abstracts may be cited by abstract number (if applicable).
                - heading "Examples" [level=5] [ref=e314]
                - paragraph [ref=e315]:
                  - text: 1. A. Author, X. Author, G. Author, in
                  - emphasis [ref=e316]: Proceedings of the 2019 Example Conference on Interesting Topic
                  - text: (Publisher, 2022), pp. 6645–6649.[published]
                - paragraph [ref=e317]:
                  - text: 2. A. Z. Author, “Example conference paper” in
                  - emphasis [ref=e318]: Proceedings of the 2021 Example Conference on Interesting Topic
                  - text: (Publisher, 2021), abstr. 875.[published, paper title and abstract number provided]
                - paragraph [ref=e319]: 3. M. Author, paper presented at the 25th Annual Meeting of Example Organization, Washington, DC, 10 to 13 October 2022.[unpublished]
                - heading "Theses" [level=4] [ref=e320]
                - paragraph [ref=e321]: Name the university but not the degree. Name the city if the university could be mistaken for another. It is optional to include the thesis title.
                - heading "Examples" [level=5] [ref=e322]
                - paragraph [ref=e323]: 1. B. Author, thesis, Example University (2021).[no title]
                - paragraph [ref=e324]: 2. R. Author, “Example title on an interesting topic,” thesis, Example University, Washington, DC (2020).[with title and city]
                - heading "Preprints" [level=4] [ref=e325]
                - paragraph [ref=e326]: For arXiv, embed the URL in arXiv:identifier, but do not include the word “Preprint.” For bioRxiv and others, include “[Preprint]” after the article identifier, and insert the DOI (preferably in URL format) at the end.
                - heading "Examples" [level=5] [ref=e327]
                - paragraph [ref=e328]:
                  - text: 1. J. V. Author, E. Author, D. F. Author, Example preprint title.
                  - link "arXiv:1111.12345" [ref=e329] [cursor=pointer]:
                    - /url: https://arxiv.org/abs/1111.12345
                  - text: "[category] (2021).[arXiv]"
                - paragraph [ref=e330]:
                  - text: 2. D. Z. Author, K. Author, U. Author, M. R. Author, Example preprint title. bioRxiv 0123456 [Preprint] (2020).
                  - link "https://doi.org/10.1101/0123456" [ref=e331] [cursor=pointer]:
                    - /url: https://doi.org/10.1101/0123456
                  - text: .[bioRxiv]
                - heading "Datasets" [level=4] [ref=e332]
                - paragraph [ref=e333]: List the version number, if applicable. Provide a DOI or other persistent identifier (preferably in URL format).
                - heading "Example" [level=5] [ref=e334]
                - paragraph [ref=e335]:
                  - text: 1. D. Author, Example dataset title, version 1, Example Repository Name (2021);
                  - link "https://doi.org/10.12345/ABC1234567" [ref=e336] [cursor=pointer]:
                    - /url: https://doi.org/10.12345/ABC1234567
                  - text: .
                - heading "Software" [level=4] [ref=e337]
                - paragraph [ref=e338]:
                  - text: Include the version number (if applicable). Provide a DOI (preferably in URL format) or other persistent identifier. If a persistent identifier does not exist, include a URL to where the software exists. If there is an article that describes the software, it should be cited in addition to the software itself. Do not cite the article instead of the software. A consensus guide to citing software, by a working group of multiple publishers, can be found
                  - link "here" [ref=e339] [cursor=pointer]:
                    - /url: https://f1000research.com/articles/9-1257
                  - text: .
                - heading "Example" [level=5] [ref=e340]
                - paragraph [ref=e341]:
                  - text: 1. A. Author, B. Author, Example software title, version 2, Example Repository Name (2022);
                  - link "https://doi.org/10.12345/ABC000999" [ref=e342] [cursor=pointer]:
                    - /url: https://doi.org/10.12345/ABC000999
                  - text: .
                - paragraph [ref=e343]:
                  - link "Back to Top" [ref=e344] [cursor=pointer]:
                    - /url: "#ContentTop"
